; Magento's recommended settings for a development store.
memory_limit = 4G
max_execution_time = 1800
realpath_cache_size = 10M
realpath_cache_ttl = 7200
zlib.output_compression = Off

opcache.memory_consumption = 512
opcache.max_accelerated_files = 100000
opcache.save_comments = 1
opcache.validate_timestamps = 1

; XDEBUG_MODE in the environment decides whether any of this is active.
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.output_dir = /app/var

; Outgoing mail goes to SMTP_HOST, which is the bundled Mailpit unless .env says otherwise.
sendmail_path = "/usr/bin/msmtp -t --host=${SMTP_HOST} --port=${SMTP_PORT} --auth=off --tls=off --from=magento@example.test"
