; Listens on a socket in the volume nginx shares, so neither side depends on the other's IP address.
[www]
listen = /run/php/fpm.sock
listen.mode = 0666
; The pool's status page, read over this socket by an exporter that shares it. nginx passes every request
; to index.php, so no address of the store reaches it.
pm.status_path = /fpm-status
