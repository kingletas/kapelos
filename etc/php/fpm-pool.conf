; Listens on a socket in the volume nginx shares, so neither side depends on the other's IP address.
[www]
listen = /run/php/fpm.sock
listen.mode = 0666
; The pool's status page, asked for only by nginx's server on 8081 with fixed parameters. The store's own
; server hands every request to index.php, so no address of the store reaches it.
pm.status_path = /fpm-status
